function donut(o){var k=Object.keys(o),T=0,cs=['#2ec4b6','#f5a524','#9b8cff','#ff6b8b'],a=0,g=[];k.forEach(function(x){T+=o[x]});if(!T)return '<p class="mut">No data yet.</p>';k.forEach(function(x,i){var p=o[x]/T*100;g.push(cs[i%4]+' '+a+'% '+(a+p)+'%');a+=p});
return '<div style="display:flex;gap:16px;align-items:center"><div style="width:96px;height:96px;border-radius:50%;background:conic-gradient('+g.join(',')+');display:grid;place-items:center"><div style="width:58px;height:58px;border-radius:50%;background:var(--sf)"></div></div><div style="flex:1">'+k.map(function(x,i){return '<div class="tot"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:'+cs[i%4]+';margin-right:6px"></i>'+x+'</span><b>'+Math.round(o[x]/T*100)+'%</b></div>'}).join('')+'</div></div>'}
function bars(B,L){var mx=Math.max.apply(null,B)||1;return '<div class="ch">'+B.map(function(v){return '<div class="bc"><i style="height:'+(v/mx*100)+'%"></i></div>'}).join('')+'</div><div class="tot mut" style="font-size:12px;margin-top:4px"><span>'+L[0]+'</span><span>'+L[Math.floor(L.length/2)]+'</span><span>'+L[L.length-1]+'</span></div>'}
function shr2(k){var t=window[k];if(window.AndroidPrinter){AndroidPrinter.share(t);return}try{if(navigator.share)navigator.share({text:t});else{navigator.clipboard.writeText(t);note('Copied',1)}}catch(e){}}
function rep(){var now=new Date(),d0=new Date();d0.setHours(0,0,0,0);var DAY=864e5,st=rp=='today'?d0.getTime():rp=='7'?d0.getTime()-6*DAY:rp=='30'?d0.getTime()-29*DAY:0,
S=D.sales.filter(function(s){return !s.v&&s.t>=st}),tot=0,it=0,dc=0,tx=0,by={},top={},cg={},N=rp=='today'?24:rp=='7'?7:rp=='30'?30:12,B=[],L=[],MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
S.forEach(function(s){tot+=s.tot;dc+=s.disc||0;tx+=s.tax||0;by[s.pay]=(by[s.pay]||0)+s.tot;s.l.forEach(function(l){it+=l.q;top[l.n]=(top[l.n]||0)+l.p*l.q;var c=catOf(l);cg[c]=(cg[c]||0)+l.p*l.q})});
for(var k=0;k<N;k++){B.push(0);if(rp=='today')L.push(k==0?'12am':k<12?k+'am':k==12?'12pm':(k-12)+'pm');else if(rp=='all'){var md=new Date(now.getFullYear(),now.getMonth()-(N-1-k),1);L.push(MN[md.getMonth()])}else{var dd=new Date(d0.getTime()-(N-1-k)*DAY);L.push(dd.getDate()+' '+MN[dd.getMonth()])}}
S.forEach(function(s){var t=new Date(s.t),ix;if(rp=='today')ix=t.getHours();else if(rp=='all')ix=N-1-((now.getFullYear()*12+now.getMonth())-(t.getFullYear()*12+t.getMonth()));else ix=N-1-Math.round((d0.getTime()-new Date(t.getFullYear(),t.getMonth(),t.getDate()).getTime())/DAY);if(ix>=0&&ix<N)B[ix]+=s.tot});
var pk=B.indexOf(Math.max.apply(null,B)),n=S.length,P=[['today','Today'],['7','7 days'],['30','30 days'],['all','All time']],
nm={today:'Today',7:'Last 7 days',30:'Last 30 days',all:'All time'}[rp];
window.rtx='Sales report - '+nm+'\nTotal: '+m(tot)+'\nOrders: '+n+'\nAvg bill: '+m(n?tot/n:0)+'\nItems sold: '+it+'\nDiscounts: '+m(dc)+'\nTax: '+m(tx);
window.rcsv='date,bill,payment,items,discount,tax,total\n'+D.sales.filter(function(s){return !s.v}).map(function(s){return [new Date(s.t).toLocaleString().replace(/,/g,''),s.no,s.pay,s.l.reduce(function(a,l){return a+l.q},0),s.disc||0,s.tax||0,s.tot].join(',')}).join('\n');
function kp(a,b){return '<div class="card"><span>'+a+'</span><b>'+b+'</b></div>'}
$('v').innerHTML='<div class="chips">'+P.map(function(p){return '<button class="'+(rp==p[0]?'on':'')+'" onclick="rp=\''+p[0]+'\';draw()">'+p[1]+'</button>'}).join('')+'</div>'+
'<div class="card"><span class="mut">'+nm+' sales</span><div class="big">'+m(tot)+'</div><span class="mut">'+n+' orders'+(n?' \u00b7 busiest '+L[pk]:'')+'</span></div>'+
'<div class="kp">'+kp('Avg bill',m(n?tot/n:0))+kp('Items sold',it)+kp('Discounts',m(dc))+kp('Tax collected',m(tx))+'</div>'+
'<div class="card"><b>'+(rp=='today'?'Sales by hour':rp=='all'?'Sales by month':'Sales by day')+'</b><div style="margin-top:8px">'+bars(B,L)+'</div></div>'+
'<div class="card"><b>Payment methods</b><div style="margin-top:10px">'+donut(by)+'</div></div>'+
'<div class="card"><b>Top items</b>'+hb(top,6)+'</div><div class="card"><b>Sales by category</b>'+hb(cg,6)+'</div>'+
'<div class="two"><button class="btn g" onclick="shr2(\'rtx\')">Share report</button><button class="btn g" onclick="shr2(\'rcsv\')">Share sales CSV</button></div>'}
/* ---------- Setup ---------- */
function sw(k,t){return '<label class="sw"><span>'+t+'</span><input type="checkbox" '+(D.cfg[k]?'checked':'')+' onchange="D.cfg.'+k+'=this.checked;save()"></label>'}
function setup(){$('v').innerHTML='<div class="card"><b>Printer and drawer</b><p class="mut" style="margin:4px 0 10px">Plug the RP326 into the phone with an OTG cable, tap Connect printer, choose it and tap Allow. Open this file directly in Chrome. Cash drawer plugs into the printer’s drawer port.</p><div class="two"><button class="btn" onclick="connect()">Connect printer</button><button class="btn g" onclick="testPrint()">Test print</button></div><button class="btn g" style="width:100%;margin-top:8px" onclick="openDrawer()">Open cash drawer</button>'+
'<div style="margin-top:8px">'+sw('ar','Auto print receipt after each sale')+sw('ao','Auto print order ticket')+sw('dr','Open drawer on cash sales')+'</div>'+
'<label class="mut">Print method</label><select onchange="D.cfg.pm=this.value;save()"><option value="usb" '+(D.cfg.pm!='raw'&&D.cfg.pm!='web'?'selected':'')+'>Direct USB (recommended)</option><option value="raw" '+(D.cfg.pm=='raw'?'selected':'')+'>RawBT app</option><option value="web" '+(D.cfg.pm=='web'?'selected':'')+'>Phone print menu (no drawer/cut)</option></select><label class="mut">Screen layout</label><select onchange="D.cfg.vm=this.value;save();draw()"><option value="tablet" '+(vmode()=='tablet'?'selected':'')+'>Tablet / POS full view</option><option value="auto" '+(vmode()=='auto'?'selected':'')+'>Auto</option></select><label class="mut">Receipt font</label><select onchange="D.cfg.fs=this.value;save()"><option value="img" '+(D.cfg.fs!='text'?'selected':'')+'>Professional (image)</option><option value="text" '+(D.cfg.fs=='text'?'selected':'')+'>Plain text (fast)</option></select><label class="mut">Paper size</label><select onchange="D.cfg.w=+this.value;save()"><option value="32" '+(D.cfg.w==32?'selected':'')+'>58 mm</option><option value="48" '+(D.cfg.w==48?'selected':'')+'>80 mm</option></select></div>'+
'<div class="card"><b>Receipt details</b><div style="display:grid;gap:8px;margin-top:8px"><input placeholder="Outlet name" value="'+esc(D.cfg.shop)+'" onchange="D.cfg.shop=this.value||\'My Shop\';save();draw()"><input type="tel" placeholder="Mobile number" value="'+esc(D.cfg.ph)+'" onchange="D.cfg.ph=this.value;save()"><input placeholder="Address" value="'+esc(D.cfg.ad)+'" onchange="D.cfg.ad=this.value;save()"><input placeholder="GST / other detail (optional)" value="'+esc(D.cfg.gs)+'" onchange="D.cfg.gs=this.value;save()"><textarea rows="2" placeholder="Header text (below shop details)" onchange="D.cfg.hd=this.value;save()">'+esc(D.cfg.hd)+'</textarea><textarea rows="2" placeholder="Footer text (end of receipt)" onchange="D.cfg.ft=this.value;save()">'+esc(D.cfg.ft||'')+'</textarea></div><p class="mut">Printed on every receipt. Use English letters for the printer.</p></div>'+
'<div class="card"><b>Admin PIN</b><p class="mut" style="margin:4px 0 8px">User mode can only bill and collect pending payments. Admin mode sees reports, history, items and settings.</p><button class="btn g" style="width:100%" onclick="pinDlg()">'+(D.cfg.pin?'Change PIN':'Set PIN')+'</button></div>'+
'<div class="card"><b>WhatsApp</b><div style="display:grid;gap:8px;margin-top:8px"><input type="tel" placeholder="WhatsApp number with country code (e.g. 919876543210)" value="'+esc(D.cfg.wa)+'" onchange="D.cfg.wa=this.value;save()"></div><p class="mut">Day-end summary goes to this number on WhatsApp when internet is available. Leave empty to pick a contact.</p></div>'+
'<div class="card"><b>Tax and backup</b><div class="two" style="margin-top:8px"><input value="'+esc(D.cfg.shop)+'" onchange="D.cfg.shop=this.value||\'My Shop\';save();draw()"><input type="number" inputmode="decimal" value="'+D.cfg.tax+'" onchange="D.cfg.tax=Math.max(0,+this.value||0);save()" placeholder="Tax %"></div><p class="mut">Shop name and tax % (applied after discount).</p><div class="two"><button class="btn g" onclick="bk()">Share backup</button><button class="btn g" onclick="rs()">Restore backup</button></div></div>'+
'<div class="card"><b>System check</b><div id="chk" class="mut" style="margin-top:6px">Checking…</div></div>';chk()}
async function chk(){var R=[],ua=navigator.userAgent,inFrame=window.top!==window,a=/Android/.test(ua);
R.push([!!navigator.usb,'USB printing support','Use Chrome on Android (or Chrome/Edge on a computer).']);
R.push([!inFrame,'Opened directly (not inside another app)','Open the link in Chrome itself. Printers are blocked inside the Claude chat view.']);
R.push([location.protocol=='https:','Secure page (HTTPS)','USB needs HTTPS.']);
R.push([dev!=null,'Printer connected'+(dev?': '+esc(dev.productName||'USB device'):''),'Tap Connect printer and choose it.']);
var st=false;try{st=navigator.storage&&navigator.storage.persist?await navigator.storage.persist():false}catch(e){}R.push([st,'Data kept safely on this phone','Share a backup regularly. Browsers can clear data when space runs low.']);
R.push([navigator.onLine,'Internet (only needed to load the page once)','Add to Home Screen while online.']);
$('chk').innerHTML=R.map(function(r){return '<div class="row"><span class="'+(r[0]?'ok':'bad')+'">'+(r[0]?'✓':'✗')+'</span><div class="f">'+r[1]+(r[0]?'':'<div class="mut">'+r[2]+'</div>')+'</div></div>'}).join('')+'<div class="mut" style="margin-top:6px">'+(a?'Android':'Not Android')+' · screen '+screen.width+'×'+screen.height+'</div>'}
function bk(){if(!adm)return note('Admin only');var t=JSON.stringify(D);if(window.AndroidPrinter){AndroidPrinter.share(t);return}try{if(navigator.share)navigator.share({title:'POS backup',text:t});else{navigator.clipboard.writeText(t);note('Backup copied.')}}catch(e){}}
function rs(){if(!adm)return note('Admin only');var t=prompt('Paste your backup text:');if(!t)return;try{var o=JSON.parse(t);if(o.items&&o.sales){D=o;D.pend=D.pend||[];D.due=D.due||[];D.cx=D.cx||[];D.cats=D.cats||[];fixCats();D.cfg=Object.assign({shop:'My Shop',tax:0,w:48,pm:'usb',tn:12,wa:''},D.cfg);save();draw()}else throw 0}catch(e){note('That backup text is not valid.')}}
var adm=!D.cfg.pin,last=Date.now(),fails=0,until=0;
function hs(x){var h=5381,t='pos|'+x+'|k9';for(var i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return String(h)}
function lock(){adm=false;disc=0;tab='sale';view='home';bv=false;menu(0);if($('dlg').open)$('dlg').close();draw()}
function loginDlg(){var d=$('dlg');d.innerHTML='<b>Admin login</b><input id="pn" type="password" inputmode="numeric" placeholder="Enter PIN" style="margin:10px 0"><button class="btn pay" style="width:100%;padding:13px" onclick="login()">Login</button><button class="btn w" style="width:100%;margin-top:6px" onclick="forgot()">Forgot PIN?</button>';d.showModal()}
function login(){if(Date.now()<until){note('Too many wrong tries. Wait a minute.');return}if(!D.cfg.pin||hs($('pn').value.trim())==D.cfg.pin){adm=true;fails=0;last=Date.now();$('dlg').close();menu(0);draw();note('Admin mode on',1)}else{fails++;if(fails>=5){until=Date.now()+60000;fails=0}note('Wrong PIN');$('pn').value=''}}
function forgot(){var d=$('dlg');d.innerHTML='<b>Reset PIN</b><p class="mut" style="margin:6px 0 10px">Enter the recovery code you saved and a new PIN.</p><div style="display:grid;gap:8px"><input id="rc" inputmode="numeric" placeholder="Recovery code"><input id="np" type="password" inputmode="numeric" placeholder="New PIN (4-8 digits)"></div><button class="btn" style="width:100%;margin-top:10px" onclick="doReset()">Reset PIN</button>'}
function doReset(){var c=$('rc').value.trim(),p=$('np').value.trim();if(hs(c)!=D.cfg.rc){note('Wrong recovery code');return}if(!/^\d{4,8}$/.test(p)){note('PIN must be 4 to 8 digits');return}D.cfg.pin=hs(p);save();adm=true;$('dlg').close();draw();note('PIN reset. Admin mode on.',1)}
function pinDlg(){var d=$('dlg');d.innerHTML='<b>'+(D.cfg.pin?'Change admin PIN':'Set admin PIN')+'</b><p class="mut" style="margin:6px 0 10px">Staff in User mode can only bill and collect payments. Only admin sees reports and settings.</p><div style="display:grid;gap:8px"><input id="p1" type="password" inputmode="numeric" placeholder="New PIN (4-8 digits)"><input id="p2" type="password" inputmode="numeric" placeholder="Confirm PIN"></div><div class="two" style="margin-top:10px"><button class="btn g" onclick="$(\'dlg\').close()">Later</button><button class="btn" onclick="savePin()">Save PIN</button></div>';d.showModal()}
function savePin(){var a=$('p1').value.trim(),b=$('p2').value.trim();if(!/^\d{4,8}$/.test(a)){note('PIN must be 4 to 8 digits');return}if(a!=b){note('PINs do not match');return}var u=new Uint32Array(1);(window.crypto&&crypto.getRandomValues?crypto:{getRandomValues:function(z){z[0]=Math.random()*4e9}}).getRandomValues(u);var rc=String(10000000+(u[0]%90000000));D.cfg.pin=hs(a);D.cfg.rc=hs(rc);save();$('dlg').innerHTML='<b>PIN saved</b><p class="mut" style="margin:8px 0">Write down this recovery code. It is the only way to reset a forgotten PIN:</p><div class="big" style="text-align:center;letter-spacing:3px">'+rc+'</div><button class="btn" style="width:100%;margin-top:12px" onclick="$(\'dlg\').close();draw()">I have saved it</button>'}
document.addEventListener('click',function(){last=Date.now()},true);setInterval(function(){if(adm&&D.cfg.pin&&Date.now()-last>600000)lock()},30000);
fixCats();
draw();auto();if(!D.cfg.pin&&!D.cfg.pa){D.cfg.pa=1;save();setTimeout(pinDlg,400)}
</script></body></html>
